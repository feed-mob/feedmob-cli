name: Release dry run

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (must match FeedMob::CLI::VERSION)
        required: true
        type: string
      publish:
        description: Publish the GitHub Release and prepare the Tap PR (requires the protected release environment).
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  validate:
    name: Validate release inputs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Validate requested version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          test "$RELEASE_VERSION" = "$(ruby -Ilib -r feedmob/cli/version -e 'print FeedMob::CLI::VERSION')"
          ruby -e 'abort "Invalid version" unless ENV.fetch("RELEASE_VERSION").match?(/\A\d+\.\d+\.\d+(?:[-.][0-9A-Za-z.-]+)?\z/)'
      # Publish-only gates: dry runs must be able to build from any branch so
      # release changes can be verified before merging.
      - name: Verify source commit is on the default branch
        if: inputs.publish
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          case "$RELEASE_VERSION" in
            *-*)
              echo "Prerelease $RELEASE_VERSION may build from any commit"
              ;;
            *)
              git fetch origin main
              git merge-base --is-ancestor HEAD origin/main
              ;;
          esac
      - name: Verify the version was not released before
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          ! gh release view "v$RELEASE_VERSION" --repo feed-mob/feedmob-cli
          test -z "$(git ls-remote --tags origin "refs/tags/v$RELEASE_VERSION")"
      - run: bundle exec rake test
      - run: bundle exec rubocop --format simple
      - run: gem build feedmob-cli.gemspec
      - name: Validation summary
        run: |
          {
            echo "- commit: $GITHUB_SHA"
            echo "- CLI version: ${{ inputs.version }}"
            ruby -ryaml -e 'c = YAML.load_file("packaging/release.yml").fetch("tebako"); puts "- Tebako release: #{c.fetch("release_version")}, format: #{c.fetch("format_version")}, Ruby: #{c.fetch("ruby_version")}"'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build (${{ matrix.target }})
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-15
          - target: macos-x86_64
            runner: macos-15-intel
          - target: linux-arm64
            runner: ubuntu-24.04-arm
          - target: linux-x86_64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - run: uname -s
      - run: uname -m
      - name: Fetch and verify Tebako
        run: script/fetch-tebako-tool --target ${{ matrix.target }} --output "$RUNNER_TEMP/tebako"
      - name: Press and verify standalone
        run: script/press-release-artifact --target ${{ matrix.target }} --tebako "$RUNNER_TEMP/tebako" --output "$RUNNER_TEMP/fm"
      - name: Linux encrypted credential smoke
        if: startsWith(matrix.target, 'linux-')
        run: script/smoke-release-auth --artifact "$RUNNER_TEMP/fm"
      - name: Package native release asset
        run: script/package-homebrew-artifact --target ${{ matrix.target }} --artifact "$RUNNER_TEMP/fm" --tebako "$RUNNER_TEMP/tebako" --output "$RUNNER_TEMP/release-assets"
      - name: Build summary
        run: |
          {
            echo "- target: ${{ matrix.target }} ($(uname -s) $(uname -m))"
            echo "- archive: $(cat "$RUNNER_TEMP"/release-assets/*.sha256)"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          retention-days: 7

  assemble:
    name: Assemble release assets
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: ${{ runner.temp }}/release-input
          merge-multiple: true
      - run: script/assemble-homebrew-release --input "$RUNNER_TEMP/release-input" --output "$RUNNER_TEMP/release-output"
      - uses: actions/upload-artifact@v4
        with:
          name: feedmob-cli-${{ inputs.version }}-release-assets
          path: ${{ runner.temp }}/release-output/*
          if-no-files-found: error
          retention-days: 7
      - name: Publish summary
        run: |
          cat "$RUNNER_TEMP/release-output/SHA256SUMS" >> "$GITHUB_STEP_SUMMARY"
          printf '\n```json\n' >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/release-output/release-assets.json" >> "$GITHUB_STEP_SUMMARY"
          printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish GitHub Release
    if: inputs.publish
    needs: assemble
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - uses: actions/download-artifact@v4
        with:
          name: feedmob-cli-${{ inputs.version }}-release-assets
          path: ${{ runner.temp }}/release-output
      - name: Draft, verify, and publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: script/publish-release --version ${{ inputs.version }} --input "$RUNNER_TEMP/release-output" --manifest-out "$RUNNER_TEMP/release-assets-with-ids.json"
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-with-ids
          path: ${{ runner.temp }}/release-assets-with-ids.json
          if-no-files-found: error
          retention-days: 7
      - name: Publish summary
        run: 'echo "- published: https://github.com/feed-mob/feedmob-cli/releases/tag/v${{ inputs.version }}" >> "$GITHUB_STEP_SUMMARY"'

  tap-pr:
    name: Prepare Homebrew Tap PR
    if: inputs.publish
    needs: publish
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          path: feedmob-cli
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      # The PAT needs contents:write + pull_requests:write on
      # feed-mob/homebrew-tap and contents:read on feed-mob/feedmob-cli (the
      # formula audit downloads the private release assets).
      - uses: actions/checkout@v4
        with:
          repository: feed-mob/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap
      - uses: actions/download-artifact@v4
        with:
          name: release-assets-with-ids
          path: ${{ runner.temp }}
      - name: Render Formula into the Tap
        run: feedmob-cli/script/render-homebrew-formula --version ${{ inputs.version }} --assets-json "$RUNNER_TEMP/release-assets-with-ids.json" --output homebrew-tap/Formula/fm.rb
      - name: Homebrew style and audit
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          export PATH="/home/linuxbrew/.linuxbrew/bin:$PATH"
          mkdir -p "$(brew --repository)/Library/Taps/feed-mob"
          ln -sfn "$GITHUB_WORKSPACE/homebrew-tap" "$(brew --repository)/Library/Taps/feed-mob/homebrew-tap"
          brew style feed-mob/tap/fm
          brew audit --online feed-mob/tap/fm
      - name: Open the Tap PR
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          cd homebrew-tap
          git config user.name feedmob-release
          git config user.email release@feedmob.invalid
          git switch -c "codex/fm-${{ inputs.version }}"
          git add Formula/fm.rb
          git commit -m "fm ${{ inputs.version }}"
          git push -u origin "codex/fm-${{ inputs.version }}"
          CHECKSUMS=$(ruby -rjson -e 'JSON.parse(File.read(ARGV[0])).fetch("assets").each_value { |a| puts "#{a.fetch("sha256")}  #{a.fetch("name")}" }' "$RUNNER_TEMP/release-assets-with-ids.json")
          gh pr create --repo feed-mob/homebrew-tap \
            --title "fm ${{ inputs.version }}" \
            --body "Release: https://github.com/feed-mob/feedmob-cli/releases/tag/v${{ inputs.version }}

          Built and verified by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} (four native targets, real Tebako press, Linux credential smoke).

          \`\`\`
          ${CHECKSUMS}
          \`\`\`

          Manual review required; the release workflow never merges Tap PRs."
      - name: Tap PR summary
        run: echo "- Tap PR opened from branch codex/fm-${{ inputs.version }}; review and merge manually" >> "$GITHUB_STEP_SUMMARY"
